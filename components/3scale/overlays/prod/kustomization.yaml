apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - secrets.yaml
  - internal-tenant.yaml
  - external-tenant.yaml
  - echo-api-product.yaml
patches:
  - target:
      kind: APIManager
      name: apimanager
    patch: |-
      - op: replace
        path: /spec/wildcardDomain
        value: prod.apps.example.com
